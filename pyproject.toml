[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robonix-compute-optimization"
version = "0.3.0"
description = "RoboNix service package for instruction-following navigation on a compute-optimized dual-system runtime"
readme = "README.md"
requires-python = ">=3.9"
license = "MulanPSL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hangyu Cao", email = "3087918372@qq.com" }]
keywords = ["robonix", "embodied-ai", "vln", "navigation", "compute-optimization", "edge-inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "msgpack>=1.0",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=7",
  "pytest-timeout>=2",
  # Reads package_manifest.yaml / config.spec so the Robonix package metadata
  # is checked against the code rather than drifting from it.
  "PyYAML>=6",
]
websocket = [
  "websockets>=12",
]
download = [
  "huggingface-hub>=0.23",
]
torch = [
  "torch",
]

[project.urls]
Homepage = "https://github.com/i6bimua/service-navigation-vln-rbnx"
Repository = "https://github.com/i6bimua/service-navigation-vln-rbnx"
Documentation = "https://github.com/i6bimua/service-navigation-vln-rbnx#readme"
Issues = "https://github.com/i6bimua/service-navigation-vln-rbnx/issues"

[project.scripts]
robonix-compute-download = "robonix_compute.cli.download:main"
robonix-compute-export-s1 = "robonix_compute.cli.export_s1:main"
robonix-compute-cloud = "robonix_compute.cli.cloud:main"
robonix-compute-edge = "robonix_compute.cli.edge:main"
robonix-compute-habitat-smoke = "robonix_compute.cli.habitat_smoke:main"
robonix-compute-habitat-eval = "robonix_compute.cli.habitat_eval:main"
robonix-compute-skill = "robonix_compute.cli.robonix_skill:main"
robonix-compute-preflight = "robonix_compute.cli.preflight:main"
robonix-compute-data-check = "robonix_compute.cli.data_check:main"

[tool.setuptools.packages.find]
include = ["robonix_compute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --maxfail=1"
# `rbnx build`/`rbnx boot` write into tests/harness/, and both would break
# collection: codegen emits proto stubs named test_msgs_pb2.py, and a `url:`
# package in the deployment manifest is cloned whole, test suite included.
# The first four entries are pytest's defaults, which naming this option drops.
norecursedirs = ["*.egg", ".*", "build", "dist", "rbnx-build", "rbnx-boot"]
markers = [
  "integration: integration tests",
  "gpu: requires CUDA/GPU",
  "habitat: requires Habitat simulator and VLN data",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
