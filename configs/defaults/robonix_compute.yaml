runtime:
  cloud_host: ${ROBONIX_COMPUTE_CLOUD_HOST:-0.0.0.0}
  cloud_port: ${ROBONIX_COMPUTE_CLOUD_PORT:-8765}
  checkpoint_dir: ${ROBONIX_COMPUTE_CHECKPOINT_DIR:-checkpoints}
  model_dir: ${ROBONIX_COMPUTE_MODEL_DIR:-checkpoints/InternVLA-N1}
  s1_model_dir: ${ROBONIX_COMPUTE_S1_MODEL_DIR:-checkpoints/InternVLA-N1-S1}
  depth_ckpt: ${ROBONIX_COMPUTE_DEPTH_CKPT:-checkpoints/depth_anything_v2_metric_hypersim_vits.pth}
  data_root: ${ROBONIX_COMPUTE_DATA_ROOT:-data}
  output_dir: ${ROBONIX_COMPUTE_OUTPUT_DIR:-outputs}
  role: edge

edge:
  require_initial_latent: true
  initial_timeout_s: 0.4
  min_timeout_s: 0.05
  max_timeout_s: 10.0
  timeout_window_size: 32

switching:
  tau_lower: 0.50
  tau_upper: 0.80
  tau_initial: 0.80
  delta: 0.015
  k_max: 8
  eta: 0.05

timeout:
  alpha: 0.125
  beta: 0.25
  kappa: 4.0
  window_size: 32

evaluation:
  strategy: robonix_compute_online
  legacy_manifest_strategy: reproduce/offline_selective_sync
