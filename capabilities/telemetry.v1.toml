# robonix/service/navigation/vln/telemetry — read the navigation computing
# optimization measurements for a navigation run.
#
# This is what distinguishes this service from a plain VLN policy: every step
# records whether it triggered a cloud synchronization, whether the cloud
# response timed out, whether a stale latent was reused, and how long the step
# took. Exposing it as a contract lets an operator (or the LLM) confirm the
# cloud-edge split is actually paying off at runtime instead of trusting offline
# benchmark numbers.
#
# The capability is named for what it reports, not for the mechanism; the
# mechanism's vocabulary (sync / timeout / latent reuse) stays in the field names
# below, where it belongs.
#
# Fields mirror robonix_compute.common.telemetry.TelemetryRecorder.summary().
[contract]
id      = "robonix/service/navigation/vln/telemetry"
version = "1"
kind    = "service"
idl     = "navigation_vln/srv/GetTelemetry.srv"
description = "Read cloud-edge navigation computing optimization telemetry for a navigation run."

[mode]
type = "rpc"
