# robonix/skill/compute_optimization/telemetry — read the compute-optimization measurements
# for a navigation run.
#
# This is what distinguishes this skill from a plain VLN policy: every step
# records whether it triggered a cloud synchronization, whether the cloud
# response timed out, whether a stale latent was reused, and how long the
# step took. Exposing it as a contract lets an operator (or the LLM) confirm
# the cloud-edge split is actually paying off at runtime instead of trusting
# offline benchmark numbers.
#
# Fields mirror robonix_compute.common.telemetry.TelemetryRecorder.summary().
[contract]
id      = "robonix/skill/compute_optimization/telemetry"
version = "1"
kind    = "skill"
idl     = "compute_optimization/srv/GetTelemetry.srv"
description = "Read cloud-edge compute optimization telemetry for a navigation run."

[mode]
type = "rpc"

[semantics]
user_invocable = true
