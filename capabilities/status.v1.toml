# robonix/service/navigation/computing_optimization/navigate/status — poll progress of a running
# navigation.
#
# The executor polls this every ~2s until `state` reaches a terminal value
# (SUCCEEDED | FAILED | CANCELED | TIMEOUT); anything else is treated as
# RUNNING, so the provider MUST emit those exact words. Declaring both this and
# the cancel sibling is what makes `navigate` async to the executor — declaring
# only one is a configuration error it rejects at dispatch.
#
# Answers without a loaded runtime: polling reports an unknown run even when the
# compute core has never been built, rather than loading a model to answer.
#
# An unknown run reports FAILED, not PENDING. PENDING is not terminal, and a run
# id that is unknown now stays unknown, so PENDING would keep the poll loop above
# running with nothing left to wait for.
[contract]
id      = "robonix/service/navigation/computing_optimization/navigate/status"
version = "1"
kind    = "service"
idl     = "navigation_computing_optimization/srv/GetNavigateStatus.srv"
description = "Read the state and step progress of a navigation run."

[mode]
type = "rpc"
