# robonix/service/navigation/computing_optimization/navigate/cancel — abort the active navigation
# run.
#
# Stops the observe/infer/act loop before the next chassis/move is issued.
# Idempotent: cancelling an already-finished run returns ok=true with a "no-op"
# message. Does NOT itself brake the chassis — chassis/move is a bounded
# single-shot command, so the in-flight burst completes and no further commands
# follow.
#
# Required alongside the status sibling for `navigate` to be treated as async;
# like status, it answers without a loaded runtime.
[contract]
id      = "robonix/service/navigation/computing_optimization/navigate/cancel"
version = "1"
kind    = "service"
idl     = "navigation_computing_optimization/srv/CancelNavigate.srv"
description = "Cancel a navigation run."

[mode]
type = "rpc"
