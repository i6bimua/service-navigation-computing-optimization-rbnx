# robonix/service/navigation/computing_optimization/navigate — vision-language navigation from a
# natural-language instruction.
#
# The instruction-following counterpart to `robonix/service/navigation/navigate`
# (Nav2), whose goal is a metric PoseStamped. There is no goal pose to hand to a
# planner here: VLN grounds the instruction in the live visual stream, so this
# service owns the loop itself — observe RGB-D + pose -> cloud S2 semantic
# latent -> edge S1 discrete action -> chassis/move.
#
# Example instruction: "walk down the hallway, turn left at the painting and
# stop by the kitchen door".
#
# Returns immediately with a run_id; callers poll the sibling status contract
# and abort via cancel. One run at a time.
#
# A start that cannot be accepted fails the call rather than returning
# `accepted=false`. Declaring the status and cancel siblings makes this an async
# group, and an async caller reads a run id out of any successful response and
# polls it — so a refusal has to be a failure, or that caller is left polling a
# run that will never exist.
[contract]
id      = "robonix/service/navigation/computing_optimization/navigate"
version = "1"
kind    = "service"
idl     = "navigation_computing_optimization/srv/Navigate.srv"
description = "Navigate by following a natural-language instruction using dual-system vision-language navigation."

[mode]
type = "rpc"
