# SPDX-License-Identifier: MulanPSL-2.0
#
# robonix.service.navigation.vln — instruction-following navigation, built on a
# compute-optimized dual-system runtime.
#
# kind: service. This owns a long-running navigation runtime: it consumes camera
# and pose inputs and generates chassis actions itself, rather than sequencing
# other services. That is the service boundary, so it lives at
# robonix/service/navigation/vln — the instruction-following sibling of
# robonix.service.navigation (Nav2), whose goal is a metric PoseStamped.
#
# LLM-facing invocation belongs to the thin robonix.skill.navigation.vln wrapper,
# which delegates to this service and duplicates none of the runtime below.
#
# Architecture (the mechanism, deliberately not part of the capability name):
# cloud S2 produces slow semantic latents, edge S1 produces fast actions. The
# edge runtime decides per step whether a fresh latent is needed (key-latent
# synchronization), buffers late cloud responses in a pending slot, and bounds
# network stalls with adaptive timeout prediction. See README.md for the measured
# R2R-CE numbers.
#
# The cloud S2 process is NOT a robonix package — it runs on a separate machine
# (A100-class GPU) outside this robot deployment and is reached at
# `cloud_host:cloud_port`. Same boundary as skill-vla-openvla-rbnx, whose VLA
# server is likewise a config value rather than an atlas-routed contract.
#
# Downstream (atlas-routed) dependencies, resolved in on_activate:
#   robonix/primitive/camera/rgb          (ros2, topic_out)  — observation
#   robonix/primitive/camera/depth        (ros2, topic_out)  — observation
#   robonix/primitive/camera/intrinsics   (ros2, topic_out)  — projection
#   robonix/primitive/chassis/odom        (ros2, topic_out)  — pose
#   robonix/primitive/chassis/move        (grpc, rpc)        — action output
#
# Services are activated at boot, so on_activate binds those contracts but does
# NOT load checkpoints or open the cloud link; that happens on the first navigate
# call. A deployment listing this package therefore needs neither a GPU nor a
# reachable cloud host in order to boot.
manifestVersion: 1

package:
  name: "robonix.service.navigation.vln"
  version: "0.3.0"
  description: Instruction-following navigation service — cloud S2 semantic latents plus edge S1 action generation with adaptive cloud-edge synchronization.
  license: "MulanPSL-2.0"
  tags: [service, navigation, vln, compute-optimization, cloud-edge, dual-system, embodied-ai]
  maintainers:
    - "Hangyu Cao <3087918372@qq.com>"

build: bash scripts/build.sh
start: bash scripts/start.sh
stop: bash scripts/stop.sh

# Fixed capability surface. Everything declared on atlas at startup is
# listed here; adding a capability means bumping the version and updating
# robonix_compute/rbnx/provider.py.
capabilities:
  - name: robonix/service/navigation/vln/driver
    path: capabilities/driver.v1.toml
  - name: robonix/service/navigation/vln/navigate
    path: capabilities/navigate.v1.toml
  - name: robonix/service/navigation/vln/navigate/status
    path: capabilities/status.v1.toml
  - name: robonix/service/navigation/vln/navigate/cancel
    path: capabilities/cancel.v1.toml
  - name: robonix/service/navigation/vln/telemetry
    path: capabilities/telemetry.v1.toml

depends: []
