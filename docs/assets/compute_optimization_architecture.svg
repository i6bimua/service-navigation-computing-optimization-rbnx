<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">RoboNix Compute Optimization Skill Architecture</title>
  <desc id="desc">The diagram shows the target RoboNix-facing compute optimization Skill boundary. RoboNix Pilot and Executor dispatch tasks to the Skill gateway in the target integration. Edge Runtime on Orin or Thor performs fast S1 inference, synchronization control, context buffering, timeout fallback, and telemetry. Cloud Runtime on a GPU server generates S2 semantic latent responses. RoboNix primitives provide observations and execute actions in the target deployment.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 800; text-anchor: middle; }
      .subtitle { fill: #475569; font-family: Inter, Arial, sans-serif; font-size: 16px; text-anchor: middle; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; rx: 24; }
      .lane-title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; }
      .box { stroke-width: 1.3; rx: 16; }
      .control { fill: #2563eb; stroke: #1d4ed8; }
      .skill { fill: #7c3aed; stroke: #6d28d9; }
      .edge { fill: #059669; stroke: #047857; }
      .cloud { fill: #f59e0b; stroke: #d97706; }
      .robot { fill: #334155; stroke: #1e293b; }
      .telemetry { fill: #0891b2; stroke: #0e7490; }
      .box-title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .box-text { fill: #e2e8f0; font-family: Inter, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
      .box-text-dark { fill: #475569; font-family: Inter, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
      .group { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; rx: 18; }
      .group-title { fill: #334155; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 800; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .arrow-strong { stroke: #0f172a; stroke-width: 3.2; fill: none; marker-end: url(#arrow-dark); }
      .arrow-sync { stroke: #f97316; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .arrow-telemetry { stroke: #0891b2; stroke-width: 2.6; fill: none; marker-end: url(#arrow-cyan); stroke-dasharray: 7 6; }
      .arrow-dashed { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 6; }
      .edge-label { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .legend-text { fill: #334155; font-family: Inter, Arial, sans-serif; font-size: 13px; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f172a" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f97316" />
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="920" />
  <text class="title" x="800" y="54">RoboNix Compute Optimization Skill Architecture</text>
  <text class="subtitle" x="800" y="84">Edge compute keeps the control loop responsive while cloud GPUs refresh semantic latent state on demand.</text>

  <rect class="lane" x="40" y="120" width="300" height="660" filter="url(#shadow)" />
  <text class="lane-title" x="190" y="154">RoboNix Control Plane</text>

  <rect class="box control" x="78" y="192" width="224" height="72" />
  <text class="box-title" x="190" y="222">User / RTDL Task</text>
  <text class="box-text" x="190" y="246">goal and stop condition</text>

  <rect class="box control" x="78" y="304" width="224" height="72" />
  <text class="box-title" x="190" y="334">Pilot</text>
  <text class="box-text" x="190" y="358">task planning</text>

  <rect class="box control" x="78" y="416" width="224" height="72" />
  <text class="box-title" x="190" y="446">Executor</text>
  <text class="box-text" x="190" y="470">dispatch and lifecycle</text>

  <rect class="box control" x="78" y="560" width="224" height="72" />
  <text class="box-title" x="190" y="590">Atlas / Sentinel</text>
  <text class="box-text" x="190" y="614">capability and safety</text>

  <rect class="lane" x="386" y="120" width="818" height="660" filter="url(#shadow)" />
  <text class="lane-title" x="795" y="154">Compute Optimization Skill</text>

  <rect class="box skill" x="428" y="192" width="254" height="80" />
  <text class="box-title" x="555" y="224">compute_optimization</text>
  <text class="box-text" x="555" y="248">navigate_instruction / step</text>

  <rect class="box skill" x="724" y="192" width="236" height="80" />
  <text class="box-title" x="842" y="224">Skill Gateway</text>
  <text class="box-text" x="842" y="248">HTTP API / Package API</text>

  <rect class="group" x="424" y="336" width="354" height="326" />
  <text class="group-title" x="601" y="366">Edge Runtime: Orin / Thor</text>

  <rect class="box edge" x="454" y="402" width="136" height="70" />
  <text class="box-title" x="522" y="430">Observation</text>
  <text class="box-text" x="522" y="452">adapter</text>

  <rect class="box edge" x="620" y="402" width="128" height="70" />
  <text class="box-title" x="684" y="430">S1 Runner</text>
  <text class="box-text" x="684" y="452">fast action</text>

  <rect class="box edge" x="454" y="518" width="136" height="80" />
  <text class="box-title" x="522" y="548">Sync Control</text>
  <text class="box-text" x="522" y="572">switch / lock</text>

  <rect class="box edge" x="620" y="518" width="128" height="80" />
  <text class="box-title" x="684" y="548">Context Buffer</text>
  <text class="box-text" x="684" y="572">active / pending</text>

  <rect class="group" x="820" y="336" width="344" height="326" />
  <text class="group-title" x="992" y="366">Cloud Runtime: GPU Server</text>

  <rect class="box cloud" x="858" y="402" width="266" height="78" />
  <text class="box-title" x="991" y="432">S2 Latent Server</text>
  <text class="box-text" x="991" y="456">semantic latent generation</text>

  <rect class="box cloud" x="858" y="522" width="124" height="76" />
  <text class="box-title" x="920" y="552">Full Model</text>
  <text class="box-text" x="920" y="574">checkpoint</text>

  <rect class="box cloud" x="1000" y="522" width="124" height="76" />
  <text class="box-title" x="1062" y="552">Simulator</text>
  <text class="box-text" x="1062" y="574">optional eval</text>

  <rect class="box telemetry" x="724" y="700" width="236" height="58" />
  <text class="box-title" x="842" y="724">Telemetry Collector</text>
  <text class="box-text" x="842" y="744">latency / sync / reuse</text>

  <rect class="lane" x="1258" y="120" width="302" height="660" filter="url(#shadow)" />
  <text class="lane-title" x="1409" y="154">Target Robot I/O</text>

  <rect class="box robot" x="1296" y="204" width="226" height="72" />
  <text class="box-title" x="1409" y="234">RGB-D Camera</text>
  <text class="box-text" x="1409" y="258">image / depth / intrinsics</text>

  <rect class="box robot" x="1296" y="316" width="226" height="72" />
  <text class="box-title" x="1409" y="346">Pose / Map</text>
  <text class="box-text" x="1409" y="370">odom / gps / scene</text>

  <rect class="box robot" x="1296" y="480" width="226" height="72" />
  <text class="box-title" x="1409" y="510">Navigation / Chassis</text>
  <text class="box-text" x="1409" y="534">execute action chunk</text>

  <rect class="box robot" x="1296" y="648" width="226" height="72" />
  <text class="box-title" x="1409" y="678">Scribe / Vitals</text>
  <text class="box-text" x="1409" y="702">logs and health metrics</text>

  <rect class="legend" x="460" y="802" width="680" height="58" />
  <line class="arrow-strong" x1="488" y1="824" x2="558" y2="824" />
  <text class="legend-text" x="572" y="829">task/action path</text>
  <line class="arrow-sync" x1="714" y1="824" x2="784" y2="824" />
  <text class="legend-text" x="798" y="829">latent sync path</text>
  <line class="arrow-telemetry" x1="938" y1="824" x2="1008" y2="824" />
  <text class="legend-text" x="1022" y="829">telemetry path</text>

  <path class="arrow-strong" d="M190 264 L190 304" />
  <path class="arrow-strong" d="M190 376 L190 416" />
  <path class="arrow-dashed" d="M190 560 L190 488" />
  <text class="edge-label" x="248" y="528">runtime discovery</text>

  <path class="arrow-strong" d="M302 452 C346 452 366 232 428 232" />
  <text class="edge-label" x="372" y="328">dispatch</text>

  <path class="arrow-strong" d="M682 232 L724 232" />
  <path class="arrow-strong" d="M842 272 L842 304 C842 318 824 322 748 426" />
  <text class="edge-label" x="814" y="316">step input</text>

  <path class="arrow" d="M1296 240 C1120 240 720 290 522 402" />
  <path class="arrow" d="M1296 352 C1112 352 710 356 522 402" />
  <text class="edge-label" x="1116" y="267">observation</text>

  <path class="arrow" d="M590 437 L620 437" />
  <path class="arrow" d="M522 472 L522 518" />
  <path class="arrow" d="M620 558 L590 558" />
  <path class="arrow" d="M684 518 L684 472" />

  <path class="arrow-sync" d="M590 558 C690 620 786 382 858 441" />
  <text class="edge-label" x="790" y="390">latent request</text>
  <path class="arrow-sync" d="M858 456 C774 500 756 580 748 558" />
  <text class="edge-label" x="814" y="630">latent response</text>
  <path class="arrow" d="M920 522 L960 480" />
  <path class="arrow-dashed" d="M1062 522 L1030 480" />

  <path class="arrow-strong" d="M748 437 C898 466 1110 516 1296 516" />
  <text class="edge-label" x="1060" y="494">Action / Action Chunk</text>

  <path class="arrow-telemetry" d="M842 272 L842 700" />
  <path class="arrow-telemetry" d="M522 598 C580 702 648 729 724 729" />
  <path class="arrow-telemetry" d="M991 480 C976 606 934 672 882 700" />
  <path class="arrow-telemetry" d="M960 729 C1078 729 1188 684 1296 684" />
  <path class="arrow-telemetry" d="M724 729 C488 720 342 658 302 488" />
</svg>
