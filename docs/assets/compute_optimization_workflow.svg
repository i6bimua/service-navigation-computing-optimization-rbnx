<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="430" viewBox="0 0 1420 430" role="img" aria-label="Compute optimization Skill deployment and target RoboNix integration workflow">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b8794"/>
    </marker>
    <style>
      .title { font: 700 21px Inter, Arial, sans-serif; fill: #ffffff; }
      .sub { font: 500 13px Inter, Arial, sans-serif; fill: #ffffff; }
      .pill { font: 700 13px Inter, Arial, sans-serif; }
      .arrow { stroke: #7b8794; stroke-width: 2.5; marker-end: url(#arrow); }
      .shadow { filter: drop-shadow(0 4px 8px rgba(15,23,42,.14)); }
    </style>
  </defs>
  <rect width="1420" height="430" fill="#f7fafc"/>

  <g class="shadow">
    <rect x="15" y="30" width="210" height="150" rx="12" fill="#367bf5"/>
    <text x="48" y="63" class="title">1. Environment</text>
    <text x="86" y="91" class="title">Setup</text>
    <text x="68" y="108" class="sub">Cloud GPU</text>
    <text x="68" y="128" class="sub">Edge Orin / Thor</text>
    <text x="68" y="148" class="sub">Conda / PyTorch</text>
  </g>

  <line x1="228" y1="106" x2="255" y2="106" class="arrow"/>

  <g class="shadow">
    <rect x="257" y="30" width="210" height="150" rx="12" fill="#23a26d"/>
    <text x="279" y="74" class="title">2. Model Prep</text>
    <text x="312" y="105" class="sub">Download weights</text>
    <text x="311" y="126" class="sub">Export S1-only</text>
  </g>

  <line x1="470" y1="106" x2="497" y2="106" class="arrow"/>

  <g class="shadow">
    <rect x="499" y="30" width="210" height="150" rx="12" fill="#1aa7a7"/>
    <text x="530" y="74" class="title">3. Cloud Server</text>
    <text x="545" y="105" class="sub">Heavy model</text>
    <text x="535" y="126" class="sub">Semantic latent</text>
  </g>

  <line x1="712" y1="106" x2="739" y2="106" class="arrow"/>

  <g class="shadow">
    <rect x="741" y="30" width="210" height="150" rx="12" fill="#0f8686"/>
    <text x="773" y="64" class="title">4. Edge Skill</text>
    <text x="784" y="91" class="title">Gateway</text>
    <text x="785" y="112" class="sub">HTTP skill API</text>
    <text x="772" y="133" class="sub">Adaptive sync runtime</text>
  </g>

  <line x1="954" y1="106" x2="981" y2="106" class="arrow"/>

  <g class="shadow">
    <rect x="983" y="30" width="210" height="150" rx="12" fill="#f59e0b"/>
    <text x="1028" y="74" class="title">5. External</text>
    <text x="1014" y="101" class="title">Orchestration</text>
    <text x="1029" y="125" class="sub">Target RoboNix path</text>
  </g>

  <line x1="1196" y1="106" x2="1223" y2="106" class="arrow"/>

  <g class="shadow">
    <rect x="1225" y="30" width="195" height="150" rx="12" fill="#7c3aed"/>
    <text x="1248" y="64" class="title">6. Deployment</text>
    <text x="1262" y="91" class="title">&amp; Validation</text>
    <text x="1270" y="114" class="sub">Client-server</text>
    <text x="1264" y="135" class="sub">Latency telemetry</text>
  </g>

  <line x1="115" y1="314" x2="1315" y2="314" stroke="#c7d2fe" stroke-width="2"/>

  <rect x="54" y="358" width="222" height="42" rx="12" fill="#dbeafe" stroke="#367bf5"/>
  <text x="101" y="383" class="pill" fill="#367bf5">Dependencies ready</text>

  <rect x="290" y="358" width="222" height="42" rx="12" fill="#dcfce7" stroke="#23a26d"/>
  <text x="344" y="383" class="pill" fill="#178456">Weights prepared</text>

  <rect x="526" y="358" width="222" height="42" rx="12" fill="#ccfbf1" stroke="#1aa7a7"/>
  <text x="575" y="383" class="pill" fill="#0f766e">Cloud service online</text>

  <rect x="762" y="358" width="222" height="42" rx="12" fill="#cffafe" stroke="#0f8686"/>
  <text x="808" y="383" class="pill" fill="#0e7490">HTTP Skill reachable</text>

  <rect x="998" y="358" width="222" height="42" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1031" y="383" class="pill" fill="#d97706">Orchestrator calls API</text>

  <rect x="1234" y="358" width="170" height="42" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1256" y="383" class="pill" fill="#7c3aed">Runtime validated</text>
</svg>
