name: Feature or model request
description: Propose a compute optimization, model adapter, or documentation improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation plan
      description: For model or performance work, name the benchmark, hardware, metrics, and baseline.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: I checked the supported-model and benchmark reporting requirements.
          required: true
